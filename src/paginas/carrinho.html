<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Get Eats e uma aplicacao web de delivery com cardapio, carrinho, pagamento simulado e painel administrativo." />
    <link rel="icon" type="image/png" href="../assets/logos/GetEatsPNG.png" />
  <title>Carrinho - Get Eats</title>
  <link rel="stylesheet" href="../recursos/css/paginas/carrinho.css">
</head>

<body>
  <div class="header">
    <div class="header-bg"></div>
    <img src="../assets/icons/Voltar.svg" alt="Voltar" class="back-icon">
    <img src="../assets/icons/Cart.svg" alt="Pedidos" class="cart-icon-header" />
    <img src="../assets/icons/PerfilHeader.svg" alt="Perfil" class="profile-icon">
  </div>
  <div class="coupon-bar">
 <input type="text" placeholder="Aplicar cupom..." />
    <button class="apply-btn">Aplicar</button>
  </div>
  <div class="main-content">
    <div class="cart-items">
      <!-- Itens serÃ£o renderizados dinamicamente pelo JavaScript -->
    </div>

    <!-- Card de Resumo do Pedido -->
    <div class="order-summary">
      <h2>Resumo do pedido</h2>
      <div class="summary-item">
        <span>Subtotal:</span>
        <span>R$ 0,00</span>
      </div>
      <div class="summary-item">
        <span>Desconto:</span>
        <span>R$ 0,00</span>
      </div>
      <div class="summary-item">
        <span>Taxa de entrega:</span>
        <span>R$ 5,00</span>
      </div>
      <hr class="summary-divider">
      <div class="summary-total">
        <span>Total do pedido:</span>
        <span>R$ 5,00</span>
      </div>
    </div>

    <!-- EndereÃ§o de Entrega -->
    <div class="delivery-address">
      <div class="address-info">
        <img src="../assets/icons/Loc.svg" alt="Location" class="loc-icon">
        <span id="endereco-entrega">Carregando...</span>
      </div>
      <button class="change-btn" id="alterar-endereco-btn">Alterar</button>
    </div>
  </div>
  <div class="footer-nav">
    <button class="finalize-btn">Finalizar Pedido <img src="../assets/icons/Card.svg" alt="Carrinho" class="cart-icon"></button>
  </div>
  <script src="../recursos/js/auth.js"></script>
  <script src="../recursos/js/carrinho.js"></script>
  <script>
    // Classe para gerenciar a interface do carrinho
    class CarrinhoInterface {
      constructor() {
        this.carrinhoManager = carrinhoManager;
        this.init();
      }

      init() {
        this.renderizarCarrinho();
        this.configurarEventos();
        this.atualizarResumo();
        this.atualizarEndereco();
      }

      renderizarCarrinho() {
        const cartItemsContainer = document.querySelector('.cart-items');
        if (!cartItemsContainer) return;

        const itens = this.carrinhoManager.carrinho;

        if (itens.length === 0) {
          cartItemsContainer.innerHTML = `
            <div style="text-align: center; padding: 2rem; color: #666;">
              <p>Seu carrinho estÃ¡ vazio</p>
              <p><a href="cardapio.html" style="color: #FE2E2E; text-decoration: none;">Voltar ao cardÃ¡pio</a></p>
            </div>
          `;
          return;
        }

        cartItemsContainer.innerHTML = '';

        itens.forEach(item => {
          const itemElement = this.criarElementoItem(item);
          cartItemsContainer.appendChild(itemElement);
        });
      }

      criarElementoItem(item) {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'cart-item';
        itemDiv.innerHTML = `
          <div class="left-side">
            <div class="image" style="background-image: url('${item.imagem}');"></div>
            <div class="quantity">
              <div class="qty-btn" data-action="decrease" data-id="${item.id}">-</div>
              <span>${item.quantidade}</span>
              <div class="qty-btn" data-action="increase" data-id="${item.id}">+</div>
            </div>
          </div>
          <div class="details">
            <div class="title">${item.nome}</div>
            <div class="price">R$ ${(item.preco * item.quantidade).toFixed(2).replace('.', ',')}</div>
            <div class="delivery-time">PrevisÃ£o: 30-45 min</div>
          </div>
          <div class="delete-icon" data-id="${item.id}">
            <img src="../assets/icons/Delete.svg" alt="Delete">
          </div>
        `;

        return itemDiv;
      }

      configurarEventos() {
        // Eventos para botÃµes de quantidade
        document.addEventListener('click', (e) => {
          if (e.target.classList.contains('qty-btn')) {
            const action = e.target.dataset.action;
            const id = e.target.dataset.id;

            if (action === 'increase') {
              this.carrinhoManager.alterarQuantidade(id, this.carrinhoManager.carrinho.find(item => item.id === id).quantidade + 1);
            } else if (action === 'decrease') {
              this.carrinhoManager.alterarQuantidade(id, this.carrinhoManager.carrinho.find(item => item.id === id).quantidade - 1);
            }

            this.renderizarCarrinho();
            this.atualizarResumo();
          }
        });

        // Eventos para botÃµes de deletar
        document.addEventListener('click', (e) => {
          if (e.target.closest('.delete-icon')) {
            const id = e.target.closest('.delete-icon').dataset.id;
            this.carrinhoManager.removerItem(id);
            this.renderizarCarrinho();
            this.atualizarResumo();
          }
        });

        // Evento para aplicar cupom
        const applyBtn = document.querySelector('.apply-btn');
        const couponInput = document.querySelector('.coupon-bar input');

        if (applyBtn && couponInput) {
          applyBtn.addEventListener('click', () => {
            const codigo = couponInput.value.trim().toUpperCase();
            if (codigo) {
              const sucesso = this.carrinhoManager.aplicarCupom(codigo);
              if (sucesso) {
                alert('Cupom aplicado com sucesso!');
                couponInput.value = '';
                this.atualizarResumo();
              } else {
                alert('Cupom invÃ¡lido ou expirado.');
              }
            }
          });
        }

        // Evento para voltar
        const backIcon = document.querySelector('.back-icon');
        if (backIcon) {
          backIcon.addEventListener('click', function() {
            window.history.back();
          });
        }

        // Evento para alterar endereÃ§o
        const alterarEnderecoBtn = document.querySelector('#alterar-endereco-btn');
        if (alterarEnderecoBtn) {
          alterarEnderecoBtn.addEventListener('click', () => {
            const novoEndereco = prompt('Digite o novo endereÃ§o de entrega:');
            if (novoEndereco && novoEndereco.trim()) {
              this.carrinhoManager.alterarEndereco(novoEndereco.trim());
              this.atualizarEndereco();
              alert('EndereÃ§o atualizado com sucesso!');
            }
          });
        }

        // Evento para finalizar pedido
        const finalizeBtn = document.querySelector('.finalize-btn');
        if (finalizeBtn) {
          finalizeBtn.addEventListener('click', function() {
            if (this.carrinhoManager.estaVazio()) {
              alert('Seu carrinho estÃ¡ vazio. Adicione itens antes de finalizar.');
              return;
            }

            // Verificar se usuÃ¡rio estÃ¡ logado
            if (!authManager.estaLogado()) {
              alert('VocÃª precisa fazer login para finalizar o pedido.');
              window.location.href = 'login.html';
              return;
            }

            // Verificar se endereÃ§o foi definido
            if (!this.carrinhoManager.obterEndereco()) {
              alert('Por favor, defina um endereÃ§o de entrega antes de finalizar o pedido.');
              return;
            }

            window.location.href = 'pagamento.html';
          }.bind(this));
        }
      }

      atualizarResumo() {
        const resumo = this.carrinhoManager.obterResumo();

        // Obter todos os elementos .summary-item
        const summaryItems = document.querySelectorAll('.summary-item');

        // Atualizar subtotal (primeiro .summary-item)
        if (summaryItems[0]) {
          const subtotalElement = summaryItems[0].querySelector('span:last-child');
          if (subtotalElement) {
            subtotalElement.textContent = `R$ ${resumo.subtotal.toFixed(2).replace('.', ',')}`;
          }
        }

        // Atualizar desconto (segundo .summary-item)
        if (summaryItems[1]) {
          const descontoElement = summaryItems[1].querySelector('span:last-child');
          if (descontoElement) {
            descontoElement.textContent = resumo.desconto > 0 ? `-R$ ${resumo.desconto.toFixed(2).replace('.', ',')}` : 'R$ 0,00';
          }
        }

        // Atualizar taxa de entrega (terceiro .summary-item)
        if (summaryItems[2]) {
          const taxaElement = summaryItems[2].querySelector('span:last-child');
          if (taxaElement) {
            taxaElement.textContent = `R$ ${resumo.taxaEntrega.toFixed(2).replace('.', ',')}`;
          }
        }

        // Atualizar total
        const totalElement = document.querySelector('.summary-total span:last-child');
        if (totalElement) {
          totalElement.textContent = `R$ ${resumo.total.toFixed(2).replace('.', ',')}`;
        }
      }

      atualizarEndereco() {
        const enderecoElement = document.querySelector('#endereco-entrega');
        if (enderecoElement) {
          const endereco = this.carrinhoManager.obterEndereco();
          enderecoElement.textContent = endereco || 'EndereÃ§o nÃ£o definido';
        }
      }
    }

    // Inicializar interface do carrinho quando a pÃ¡gina carregar
    document.addEventListener('DOMContentLoaded', function() {
      new CarrinhoInterface();
    });
  </script>
</body>

</html>
