<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Get Eats e uma aplicacao web de delivery com cardapio, carrinho, pagamento simulado e painel administrativo." />
    <link rel="icon" type="image/png" href="../assets/logos/GetEatsPNG.png" />
<title>Pagamento</title>
<link rel="stylesheet" href="../recursos/css/principal.css">
  <link rel="stylesheet" href="../recursos/css/paginas/pagamento.css">
</head>
<body>
  <div class="form-card">
    <div class="form-card__header">
      <div class="form-card__header-bg"></div>
      <img src="../assets/logos/GetEatsSVG.svg" alt="Get Eats Logo" class="logo logo--pequeno" />
    </div>

    <div class="form-card__notch"></div>
    <div class="form-card__title">Pagamento</div>

    <button type="button" class="social-btn" id="pix-btn">
      <img src="../assets/icons/PixFull.svg" alt="PIX Icon" style="width: 12rem; height: 12rem;" />
    </button>

    <div class="form-card__separator">ou</div>

    <label class="input-field__label" for="cartao">Número do cartão</label>
    <div class="input-field">
      <div class="input-field__input">

        <input type="text" id="cartao" placeholder="1234 4567 8910 1112" />
      </div>
    </div>

    <label class="input-field__label" for="expiracao">Data de expiração</label>
    <div class="input-field">
      <div class="input-field__input">
        <input type="text" id="expiracao" placeholder="MM/AA" />
      </div>
    </div>

    <label class="input-field__label" for="cvv">CVV</label>
    <div class="input-field">
      <div class="input-field__input">
        <input type="text" id="cvv" placeholder="123" />
      </div>
    </div>

    <label class="input-field__label" for="titular">Nome do titular</label>
    <div class="input-field">
      <div class="input-field__input">
        <input type="text" id="titular" placeholder="Nome como no cartão" />
      </div>
    </div>

    <button class="btn btn--primario" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
      <img src="../assets/icons/Card.svg" alt="Card Icon" style="width: 1.25rem; height: 1.25rem;" />
      Pagar
    </button>

    <div class="form-card__forgot-password">Alterar forma de pagamento</div>

    <!-- Seção para exibir QR Code e Chave PIX -->
    <div id="pix-modal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90vw; max-width: 400px; padding: 2rem; background: white; border-radius: 0.9375rem; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); text-align: center; z-index: 1000;">
      <h3 style="margin-bottom: 1.5rem; font-size: 1.25rem; color: #222222;">QR Code PIX</h3>
      <div id="qrcode" style="margin-bottom: 1.5rem; display: flex; justify-content: center;"></div>
      <p style="margin-bottom: 1rem; font-size: 1rem; color: #666666;"><strong>Chave PIX:</strong> <span id="pix-key"></span></p>
      <button type="button" class="social-btn" id="copy-pix-key" style="width: 100%; margin-bottom: 1rem;">Copiar Chave</button>
      <button class="btn btn--primario" id="confirm-pix" style="width: 100%;">Confirmar Pagamento</button>
    </div>

    <div class="form-card__bottom-text">Pagamento seguro</div>
  </div>

  <!-- Incluir biblioteca QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const pixBtn = document.getElementById('pix-btn');
      const pixModal = document.getElementById('pix-modal');
      const qrcodeDiv = document.getElementById('qrcode');
      const pixKeySpan = document.getElementById('pix-key');
      const confirmPixBtn = document.getElementById('confirm-pix');

      pixBtn.addEventListener('click', function() {
        // Gerar chave PIX aleatória (simulando um UUID)
        const pixKey = generateRandomKey();
        pixKeySpan.textContent = pixKey;

        // Limpar QR code anterior
        qrcodeDiv.innerHTML = '';

        // Gerar QR code com a chave PIX
        new QRCode(qrcodeDiv, {
          text: pixKey,
          width: 128,
          height: 128
        });

        // Mostrar a modal
        pixModal.style.display = 'block';
      });

      confirmPixBtn.addEventListener('click', function() {
        // Mudar o botão para verde e alterar o texto
        confirmPixBtn.classList.add('green');
        confirmPixBtn.textContent = 'Pagamento Confirmado';

        // Aguardar 2 segundos antes de redirecionar
        setTimeout(function() {
          window.location.href = 'pedido-confirmado.html';
        }, 2000);
      });

      const copyPixKeyBtn = document.getElementById('copy-pix-key');
      copyPixKeyBtn.addEventListener('click', function() {
        const pixKey = pixKeySpan.textContent;
        navigator.clipboard.writeText(pixKey).then(function() {
          alert('Chave PIX copiada para a área de transferência!');
        }).catch(function(err) {
          console.error('Erro ao copiar chave PIX: ', err);
        });
      });

      function generateRandomKey() {
        // Gerar uma string aleatória de 32 caracteres (simulando chave PIX)
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        let result = '';
        for (let i = 0; i < 32; i++) {
          result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return result;
      }
    });
  </script>
</body>
</html>
